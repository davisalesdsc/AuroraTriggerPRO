name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (AU + VST3, Universal Intel + Apple Silicon)
            os: macos-14
          - name: Windows (VST3 + Standalone)
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Resolve version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^project(AuroraTrigger VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          # main and v* tags produce release files named after the version; other branches get a dev label
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then LABEL="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]]; then LABEL="v$VERSION"
          else LABEL="dev-${GITHUB_SHA::7}"; fi
          echo "VERSION_LABEL=$LABEL" >> "$GITHUB_ENV"
          echo "PROJECT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "label=$LABEL version=$VERSION"

      # Both architectures must be inside every binary
      - name: Check universal binary (macOS)
        if: runner.os == 'macOS'
        run: |
          A=build/AuroraTrigger_artefacts/Release
          for bin in "$A/VST3/Aurora Trigger.vst3/Contents/MacOS/Aurora Trigger" \
                     "$A/AU/Aurora Trigger.component/Contents/MacOS/Aurora Trigger" \
                     "$A/Standalone/Aurora Trigger.app/Contents/MacOS/Aurora Trigger"; do
            archs=$(lipo -archs "$bin")
            echo "$bin: $archs"
            case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "::error::not universal: $bin ($archs)"; exit 1 ;; esac
          done

      # Fails the build if the plugin would require a newer macOS than intended
      # (x86_64: 10.13; arm64: 11.0, the first macOS for Apple Silicon)
      - name: Check minimum macOS version
        if: runner.os == 'macOS'
        run: |
          A=build/AuroraTrigger_artefacts/Release
          for bin in "$A/VST3/Aurora Trigger.vst3/Contents/MacOS/Aurora Trigger" \
                     "$A/AU/Aurora Trigger.component/Contents/MacOS/Aurora Trigger"; do
            for arch in x86_64 arm64; do
              # LC_BUILD_VERSION prints "minos X"; older targets (10.13) use LC_VERSION_MIN_MACOSX ("version X")
              minos=$(vtool -arch $arch -show-build "$bin" | awk '$1 == "minos" || $1 == "version" {print $2; exit}')
              if [ -z "$minos" ]; then echo "::error::could not read the minimum macOS of $bin [$arch]"; exit 1; fi
              echo "$bin [$arch] minos=$minos"
              limit=10.13; [ "$arch" = arm64 ] && limit=11.0
              if [ "$(printf '%s\n%s\n' "$minos" "$limit" | sort -V | tail -1)" != "$limit" ]; then
                echo "::error::$arch requires macOS $minos (expected <= $limit)"; exit 1
              fi
            done
          done

      # Ad-hoc signature so Apple Silicon hosts load the bundles (no Apple account needed)
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          A=build/AuroraTrigger_artefacts/Release
          codesign --force --deep --sign - "$A/AU/Aurora Trigger.component"
          codesign --force --deep --sign - "$A/VST3/Aurora Trigger.vst3"
          codesign --force --deep --sign - "$A/Standalone/Aurora Trigger.app"

      - name: Build installer (.pkg)
        if: runner.os == 'macOS'
        run: |
          chmod +x packaging/macos/build_pkg.sh packaging/macos/scripts-au/postinstall
          packaging/macos/build_pkg.sh build/AuroraTrigger_artefacts/Release "$PROJECT_VERSION" \
            "dist/AuroraTrigger-$VERSION_LABEL-macOS.pkg"

      # Install the .pkg exactly like a user would, then validate the installed plugin
      - name: Test installer + validate AU (auval)
        if: runner.os == 'macOS'
        run: |
          sudo installer -pkg "dist/AuroraTrigger-$VERSION_LABEL-macOS.pkg" -target /
          test -d "/Library/Audio/Plug-Ins/Components/Aurora Trigger.component"
          test -d "/Library/Audio/Plug-Ins/VST3/Aurora Trigger.vst3"
          pkgutil --pkgs | grep com.auroraaudio.auroratrigger
          codesign --verify --deep --strict "/Library/Audio/Plug-Ins/Components/Aurora Trigger.component"
          killall -9 AudioComponentRegistrar || true
          auval -v aumf AuTr Auro

      # Load the INSTALLED plugins the way a DAW does (VST3 + AU), process audio, open the window
      - name: Load installed plugins like a DAW (macOS Apple Silicon)
        if: runner.os == 'macOS'
        run: |
          uname -m; sw_vers -productVersion
          ./build/AuroraTriggerPluginLoadTest_artefacts/Release/AuroraTriggerPluginLoadTest "/Library/Audio/Plug-Ins/VST3/Aurora Trigger.vst3"
          ./build/AuroraTriggerPluginLoadTest_artefacts/Release/AuroraTriggerPluginLoadTest AU

      - name: Load VST3 like a DAW (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./build/AuroraTriggerPluginLoadTest_artefacts/Release/AuroraTriggerPluginLoadTest.exe "build/AuroraTrigger_artefacts/Release/VST3/Aurora Trigger.vst3"

      # Zip on the runner itself so bundle structure and permissions survive
      # (upload-artifact does not preserve file permissions).
      - name: Package
        shell: bash
        run: |
          NAME="AuroraTrigger-$VERSION_LABEL-$RUNNER_OS"
          mkdir -p "dist/$NAME"
          for f in "AU/Aurora Trigger.component" "VST3/Aurora Trigger.vst3" "Standalone/Aurora Trigger.app" "Standalone/Aurora Trigger.exe"; do
            src="build/AuroraTrigger_artefacts/Release/$f"
            if [ -e "$src" ]; then cp -R "$src" "dist/$NAME/"; fi
          done
          cd dist
          case "$RUNNER_OS" in
            macOS)   ditto -c -k --keepParent "$NAME" "$NAME.zip" ;;
            Windows) 7z a -tzip "$NAME.zip" "$NAME" > /dev/null ;;
          esac
          rm -rf "$NAME"
          ls -la

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: AuroraTrigger-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.pkg
          if-no-files-found: error

  # Install the released .pkg on an INTEL Mac and load both plugins like a DAW does
  mac-intel:
    name: macOS Intel (install .pkg + load like a DAW)
    needs: build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: AuroraTrigger-macOS
          path: dist

      - name: Install the .pkg
        run: |
          uname -m; sw_vers -productVersion
          ls -la dist
          sudo installer -pkg dist/*.pkg -target /
          killall -9 AudioComponentRegistrar || true

      - name: Build the loader (native x86_64)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build --config Release --target AuroraTriggerPluginLoadTest --parallel 4

      - name: Load VST3 and AU like a DAW
        run: |
          ./build/AuroraTriggerPluginLoadTest_artefacts/Release/AuroraTriggerPluginLoadTest "/Library/Audio/Plug-Ins/VST3/Aurora Trigger.vst3"
          ./build/AuroraTriggerPluginLoadTest_artefacts/Release/AuroraTriggerPluginLoadTest AU
          auval -v aumf AuTr Auro | tail -5

  # Every push to main creates/updates the release for the version in CMakeLists.txt
  # (bump VERSION there to start a new release). Pushing a v* tag also works.
  release:
    name: Publish GitHub Release
    needs: [ build, mac-intel ]
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"
          else TAG="v$(sed -n 's/^project(AuroraTrigger VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Aurora Trigger ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: |
            dist/*.pkg
            dist/*.zip
          generate_release_notes: true
          body: |
            ## Downloads

            | Sistema | Arquivo | O que é |
            |---|---|---|
            | **macOS** (Apple Silicon + Intel, universal) | `AuroraTrigger-${{ env.TAG }}-macOS.pkg` | **Instalador** (AU + VST3) — recomendado |
            | macOS | `AuroraTrigger-${{ env.TAG }}-macOS.zip` | AU, VST3 e Standalone soltos |
            | Windows | `AuroraTrigger-${{ env.TAG }}-Windows.zip` | VST3 + Standalone (.exe) |

            ## Instalar no macOS

            Abra o `.pkg` e siga o instalador (ele pede a senha do Mac). O instalador ainda não é
            assinado pela Apple, então na primeira vez o macOS bloqueia: vá em **Ajustes do Sistema →
            Privacidade e Segurança** e clique em **Abrir Mesmo Assim**. Ou instale pelo Terminal:

            ```
            sudo installer -pkg ~/Downloads/AuroraTrigger-${{ env.TAG }}-macOS.pkg -target /
            ```

            ## Instalar no Windows

            Copie a pasta `Aurora Trigger.vst3` para `C:\Program Files\Common Files\VST3\` e peça para a DAW
            procurar plugins novos (FL Studio: *Options → Manage plugins → Find plugins*).
            O `Aurora Trigger.exe` é a versão Standalone, não precisa instalar.
