name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: a single installer, for Intel Macs (x86_64), built and tested natively.
          # (macos-26-intel is the only Mac runner pool GitHub was reliably allocating.)
          - name: macOS Intel (x86_64)
            os: macos-26-intel
            label: macOS-intel
            arch: x86_64
            minos: "10.13"
            native: true
          - name: Windows (VST3 + Standalone)
            os: windows-latest
            label: Windows
            native: true

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            MAC="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.minos }}"
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release $MAC

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # TCI decoding (synthetic fixtures), velocity layers / round robin, curves, slot Init, session state, editor
      - name: Run offline tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then T=./build/AuroraTriggerTests_artefacts/Release/AuroraTriggerTests.exe
          else T=./build/AuroraTriggerTests_artefacts/Release/AuroraTriggerTests; fi
          "$T"

      - name: Resolve version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^project(AuroraTrigger VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          # main and v* tags produce release files named after the version; other branches get a dev label
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then LABEL="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]]; then LABEL="v$VERSION"
          else LABEL="dev-${GITHUB_SHA::7}"; fi
          echo "VERSION_LABEL=$LABEL" >> "$GITHUB_ENV"
          echo "PROJECT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "label=$LABEL version=$VERSION"

      # The binaries must contain exactly this job's architecture, and require no newer macOS than intended
      - name: Check architecture and minimum macOS version (macOS)
        if: runner.os == 'macOS'
        run: |
          A=build/AuroraTrigger_artefacts/Release
          for bin in "$A/VST3/Aurora Trigger.vst3/Contents/MacOS/Aurora Trigger" \
                     "$A/AU/Aurora Trigger.component/Contents/MacOS/Aurora Trigger" \
                     "$A/Standalone/Aurora Trigger.app/Contents/MacOS/Aurora Trigger"; do
            archs=$(lipo -archs "$bin")
            echo "$bin: $archs"
            if [ "$archs" != "${{ matrix.arch }}" ]; then echo "::error::expected ${{ matrix.arch }}, got $archs: $bin"; exit 1; fi
            # LC_BUILD_VERSION prints "minos X"; older targets (10.13) use LC_VERSION_MIN_MACOSX ("version X")
            minos=$(vtool -arch ${{ matrix.arch }} -show-build "$bin" | awk '$1 == "minos" || $1 == "version" {print $2; exit}')
            echo "minos=$minos"
            if [ -z "$minos" ]; then echo "::error::could not read the minimum macOS of $bin"; exit 1; fi
            limit=${{ matrix.minos }}
            if [ "$(printf '%s\n%s\n' "$minos" "$limit" | sort -V | tail -1)" != "$limit" ]; then
              echo "::error::requires macOS $minos (expected <= $limit)"; exit 1
            fi
          done

      # Ad-hoc signature so Apple Silicon hosts load the bundles (no Apple account needed)
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          A=build/AuroraTrigger_artefacts/Release
          codesign --force --deep --sign - "$A/AU/Aurora Trigger.component"
          codesign --force --deep --sign - "$A/VST3/Aurora Trigger.vst3"
          codesign --force --deep --sign - "$A/Standalone/Aurora Trigger.app"

      - name: Build installer (.pkg)
        if: runner.os == 'macOS'
        run: |
          chmod +x packaging/macos/build_pkg.sh packaging/macos/scripts-au/postinstall
          PKG_ARCHS=${{ matrix.arch }} packaging/macos/build_pkg.sh build/AuroraTrigger_artefacts/Release "$PROJECT_VERSION" \
            "dist/AuroraTrigger-$VERSION_LABEL-${{ matrix.label }}.pkg"

      # Install the .pkg exactly like a user would, then validate the installed plugin
      - name: Test installer + validate AU (auval)
        if: runner.os == 'macOS' && matrix.native
        run: |
          sudo installer -pkg "dist/AuroraTrigger-$VERSION_LABEL-${{ matrix.label }}.pkg" -target /
          test -d "/Library/Audio/Plug-Ins/Components/Aurora Trigger.component"
          test -d "/Library/Audio/Plug-Ins/VST3/Aurora Trigger.vst3"
          pkgutil --pkgs | grep com.auroraaudio.auroratrigger
          codesign --verify --deep --strict "/Library/Audio/Plug-Ins/Components/Aurora Trigger.component"
          killall -9 AudioComponentRegistrar || true
          auval -v aumf AuTr Auro

      # Load the INSTALLED plugins the way a DAW does (VST3 + AU), process audio, open the window
      - name: Load installed plugins like a DAW (macOS, native)
        if: runner.os == 'macOS' && matrix.native
        run: |
          uname -m; sw_vers -productVersion
          ./build/AuroraTriggerPluginLoadTest_artefacts/Release/AuroraTriggerPluginLoadTest "/Library/Audio/Plug-Ins/VST3/Aurora Trigger.vst3"
          ./build/AuroraTriggerPluginLoadTest_artefacts/Release/AuroraTriggerPluginLoadTest AU

      - name: Load VST3 like a DAW (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./build/AuroraTriggerPluginLoadTest_artefacts/Release/AuroraTriggerPluginLoadTest.exe "build/AuroraTrigger_artefacts/Release/VST3/Aurora Trigger.vst3"

      # Zip on the runner itself so bundle structure and permissions survive
      # (upload-artifact does not preserve file permissions).
      - name: Package
        shell: bash
        run: |
          NAME="AuroraTrigger-$VERSION_LABEL-${{ matrix.label }}"
          mkdir -p "dist/$NAME"
          for f in "AU/Aurora Trigger.component" "VST3/Aurora Trigger.vst3" "Standalone/Aurora Trigger.app" "Standalone/Aurora Trigger.exe"; do
            src="build/AuroraTrigger_artefacts/Release/$f"
            if [ -e "$src" ]; then cp -R "$src" "dist/$NAME/"; fi
          done
          cd dist
          case "$RUNNER_OS" in
            macOS)   ditto -c -k --keepParent "$NAME" "$NAME.zip" ;;
            Windows) 7z a -tzip "$NAME.zip" "$NAME" > /dev/null ;;
          esac
          rm -rf "$NAME"
          ls -la

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: AuroraTrigger-${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.pkg
          if-no-files-found: error

  # Every push to main creates/updates the release for the version in CMakeLists.txt
  # (bump VERSION there to start a new release). Pushing a v* tag also works.
  release:
    name: Publish GitHub Release
    needs: build
    # !cancelled(): publish even if one platform's runner was unavailable. An artifact is only uploaded
    # after ALL of that platform's checks passed, so the release holds only validated builds.
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"
          else TAG="v$(sed -n 's/^project(AuroraTrigger VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check there is something to publish
        run: |
          ls -la dist
          ls dist/*.zip > /dev/null

      # The notes list ONLY the files that were actually built and validated in this run
      - name: Write release notes
        run: |
          {
            echo "## Downloads"
            echo
            echo "| Sistema | Arquivo | O que é |"
            echo "|---|---|---|"
            [ -e "dist/AuroraTrigger-$TAG-macOS-intel.pkg" ] && echo "| **macOS** (Intel x86_64) | \`AuroraTrigger-$TAG-macOS-intel.pkg\` | **Instalador** (AU + VST3) — recomendado |"
            [ -e "dist/AuroraTrigger-$TAG-macOS-intel.zip" ] && echo "| macOS Intel | \`AuroraTrigger-$TAG-macOS-intel.zip\` | AU, VST3 e Standalone soltos |"
            [ -e "dist/AuroraTrigger-$TAG-Windows.zip" ] && echo "| Windows | \`AuroraTrigger-$TAG-Windows.zip\` | VST3 + Standalone (.exe) |"
            echo
            if ls dist/*.pkg > /dev/null 2>&1; then
              echo "## Instalar no macOS"
              echo
              echo "Abra o \`.pkg\` e siga o instalador (ele pede a senha do Mac). O instalador ainda não é"
              echo "assinado pela Apple, então na primeira vez o macOS bloqueia: vá em **Ajustes do Sistema →"
              echo "Privacidade e Segurança** e clique em **Abrir Mesmo Assim**. Ou instale pelo Terminal:"
              echo
              echo '```'
              echo "sudo installer -pkg ~/Downloads/<arquivo>.pkg -target /"
              echo '```'
              echo
            fi
            if [ -e "dist/AuroraTrigger-$TAG-Windows.zip" ]; then
              echo "## Instalar no Windows"
              echo
              echo "Copie a pasta \`Aurora Trigger.vst3\` para \`C:\\Program Files\\Common Files\\VST3\\\` e peça para a DAW"
              echo "procurar plugins novos (FL Studio: *Options → Manage plugins → Find plugins*)."
              echo "O \`Aurora Trigger.exe\` é a versão Standalone, não precisa instalar."
            fi
          } > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Aurora Trigger ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: |
            dist/*.pkg
            dist/*.zip
          generate_release_notes: true
          body_path: release-notes.md
